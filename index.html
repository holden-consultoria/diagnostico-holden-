<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Ferramenta de Diagnóstico — Holden Consultoria</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#001c2c;
  color:#ffffff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:720px;
}

.card{
  background:#07283b;
  border-radius:24px;
  padding:32px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

h1{
  font-size:32px;
  margin-bottom:12px;
  line-height:1.2;
}

.subtitle{
  color:#b8d7e5;
  margin-bottom:30px;
  line-height:1.6;
}

.field{
  margin-bottom:20px;
}

label{
  display:block;
  margin-bottom:8px;
  font-size:15px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#ffffff;
  color:#111111;
  font-size:16px;
}

textarea{
  resize:vertical;
}

button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#00a8e1;
  color:#ffffff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  opacity:0.92;
}

.loading{
  display:none;
  margin-top:20px;
  text-align:center;
  font-size:15px;
  color:#b8d7e5;
}

.success{
  display:none;
  text-align:center;
}

.success h2{
  margin-bottom:12px;
  font-size:28px;
}

.success p{
  color:#cde6f2;
  line-height:1.6;
}

@media(max-width:768px){

  .card{
    padding:24px;
  }

  h1{
    font-size:28px;
  }

}

</style>

</head>

<body>

<div class="container">

  <!-- FORMULÁRIO -->

  <div class="card" id="formCard">

    <h1>Ferramenta de Diagnóstico</h1>

    <p class="subtitle">
      Responda rapidamente às perguntas abaixo e descubra oportunidades
      para melhorar a gestão de benefícios e eficiência da sua empresa.
    </p>

    <div class="field">
      <label>Nome</label>
      <input type="text" id="nome" />
    </div>

    <div class="field">
      <label>Telefone</label>
      <input type="text" id="telefone" />
    </div>

    <div class="field">
      <label>E-mail</label>
      <input type="email" id="email" />
    </div>

    <div class="field">
      <label>Empresa</label>
      <input type="text" id="empresa" />
    </div>

    <div class="field">
      <label>Cargo</label>
      <input type="text" id="cargo" />
    </div>

    <div class="field">
      <label>Consultor</label>

      <select id="consultor">

        <option value="">Selecione</option>

        <option value="Ivan Barbosa">
          Ivan Barbosa
        </option>

        <option value="Giovanna Koritar">
          Giovanna Koritar
        </option>

      </select>
    </div>

    <div class="field">
      <label>
        De 0 a 10, qual a nota da sua corretora atual?
      </label>

      <input
        type="number"
        id="q15"
        min="0"
        max="10"
      />
    </div>

    <div class="field">

      <label>
        Qual a sua corretora?
      </label>

      <input
        type="text"
        id="q15b"
        placeholder="Campo opcional"
      />

    </div>

    <div class="field">

      <label>
        O que sente falta na gestão atual?
      </label>

      <textarea
        id="q16"
        rows="5"
      ></textarea>

    </div>

    <button onclick="enviarDiagnostico()">
      Enviar Diagnóstico
    </button>

    <div class="loading" id="loading">
      Enviando diagnóstico...
    </div>

  </div>

  <!-- SUCESSO -->

  <div class="card success" id="successCard">

    <h2>
      Diagnóstico enviado com sucesso!
    </h2>

    <p>
      Obrigado pelas informações.<br>
      Nosso time entrará em contato em breve.
    </p>

  </div>

</div>

<script>

// ═══════════════════════════════════════════════════════════
// URL DO APPS SCRIPT
// ═══════════════════════════════════════════════════════════

const SHEET_URL = "https://script.google.com/macros/s/AKfycbwr6uZ7u61Pprq6of-Cq1nV64VoOT0VtWBHvLOXLhyH02tYgi0ZaC-mbvYuBoviqtZ9dg/exec";

// ═══════════════════════════════════════════════════════════
// ENVIO DO FORMULÁRIO
// ═══════════════════════════════════════════════════════════

async function enviarDiagnostico(){

  const loading = document.getElementById('loading');

  loading.style.display = 'block';

  const payload = {

    timestamp:
      new Date().toISOString(),

    nome:
      document.getElementById('nome').value,

    telefone:
      document.getElementById('telefone').value,

    email:
      document.getElementById('email').value,

    empresa:
      document.getElementById('empresa').value,

    cargo:
      document.getElementById('cargo').value,

    consultor:
      document.getElementById('consultor').value,

    q15_nota:
      document.getElementById('q15').value,

    q15b_corretora:
      document.getElementById('q15b').value,

    q16_falta:
      document.getElementById('q16').value,

    pontuacao_total: 0,

    porcentagem: 0,

    faixa: "Não calculado"

  };

  try {

    const response = await fetch(SHEET_URL, {

      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify(payload)

    });

    const result = await response.json();

    console.log('Apps Script:', result);

    loading.style.display = 'none';

    document.getElementById('formCard').style.display = 'none';

    document.getElementById('successCard').style.display = 'block';

  } catch(error){

    console.error(error);

    loading.style.display = 'none';

    alert(
      'Erro ao enviar diagnóstico. Verifique a implantação do Apps Script.'
    );

  }

}

</script>

</body>

</html>
